<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upis | Borilački klub Rukavica</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <header class="sticky top-0 bg-white border-b border-olive-700">
      <div
        class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between"
      >
        <a href="index.html" class="text-xl font-bold text-gray-700"
          >Borilački klub Rukavica</a
        >
        <nav class="hidden md:flex gap-6">
          <a href="index.html" class="hover:text-emerald-800">Naslovnica</a>
          <a href="raspored.html" class="hover:text-emerald-800">Raspored</a>
          <a href="upisi.html" class="hover:text-emerald-800">Upis</a>
        </nav>
      </div>
    </header>
    <nav class="md:hidden bg-white border-b border-gray-200">
      <div class="flex justify-around py-2 text-sm">
        <a href="index.html">Naslovnica</a>
        <a href="raspored.html">Raspored</a>
        <a href="upisi.html">Upis</a>
      </div>
    </nav>
    <section class="max-w-2xl mx-auto px-4 py-12">
      <h1 class="text-2xl font-bold mb-6">Upis na tečaj</h1>
      <form class="flex flex-col gap-4">
        <div class="flex flex-col md:flex-row gap-4">

          <div class="flex flex-col gap-1 w-full">

            <label for="name" class="text-sm font-medium">Ime i prezime</label>
            <input type="text" id="name" name="name" 
            class="border border-gray-300 rounded-md px-3 py-2 focus:border-emerald-600 focus:outline-none" />
            

          </div>
          <div class="flex flex-col gap-1 w-full">
            <label for="email" class="text-sm font-medium">E-mail adresa</label>
            <input type="email" id="email" name="email" 
            class="border border-gray-300 rounded-md px-3 py-2 focus:border-emerald-600 focus:outline-none"/>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label for="message" class="text-sm font-medium">Koji tečaj te zanima?</label>
          <textarea id="message" name="message" rows="4" 
          class="border border-gray-300 rounded-md px-3 py-2 focus:border-emerald-600 focus:outline-none"></textarea>
        </div>
        <button type="submit"
        class="bg-slate-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-emerald-800"
        >Prijavite se</button>
      </form>
    </section>

    <footer class="bg-gray-800 text-gray-300">
      <div
        class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm"
      >
        <p>Borilački klub Rukavica, Trg borilača 10, Velika Mučna</p>
        <p>Radnim danom 19-22, subotom i nedjeljom ne radimo</p>
      </div>
    </footer>
  </body>
</html>
